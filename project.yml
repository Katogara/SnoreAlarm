# XcodeGen プロジェクト定義 (https://github.com/yonaskolb/XcodeGen)
#   brew install xcodegen && xcodegen generate
name: SnoreAlarm
options:
  bundleIdPrefix: com.example
  # 未対応の言語の人には英語を出す。日本語の文はコードの中の文がそのまま訳のキーになる (en.lproj/Localizable.strings)
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    # 訳す文の一覧 (.stringsdata) をビルドで書き出す。CI で集めて訳の抜けを調べる
    SWIFT_EMIT_LOC_STRINGS: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  # 日本語を文節の切れ目で折り返す (Google の BudouX の Swift 版。「はじめる」と同じ)
  BudouX:
    url: https://github.com/griffin-stewie/BudouX.swift
    exactVersion: 0.10.0
targets:
  SnoreAlarm:
    type: application
    platform: iOS
    dependencies:
      - package: BudouX
    sources:
      - path: SnoreAlarm
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.SnoreAlarm
        INFOPLIST_FILE: SnoreAlarm/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # 開発中の診断ログ (DiagnosticLog.swift)。リリース時はこの行を消す。
        # App Store に出すときは SUBSCRIPTION_REQUIRED を足す (未登録なら監視を止める。SubscriptionStore.swift)
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DIAGNOSTICS"
  SnoreAlarmTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SnoreAlarmTests
    dependencies:
      - target: SnoreAlarm
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SnoreAlarm:
    build:
      targets:
        SnoreAlarm: all
    test:
      targets:
        - SnoreAlarmTests
