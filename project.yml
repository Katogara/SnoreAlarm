# XcodeGen プロジェクト定義 (https://github.com/yonaskolb/XcodeGen)
#   brew install xcodegen && xcodegen generate
name: SnoreAlarm
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  # 日本語を文節の切れ目で折り返す (Google の BudouX の Swift 版。「はじめる」と同じ)
  BudouX:
    url: https://github.com/griffin-stewie/BudouX.swift
    exactVersion: 0.10.0
targets:
  SnoreAlarm:
    type: application
    platform: iOS
    dependencies:
      - package: BudouX
    sources:
      - path: SnoreAlarm
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.SnoreAlarm
        INFOPLIST_FILE: SnoreAlarm/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # 開発中の診断ログ (DiagnosticLog.swift)。リリース時はこの行を消す
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DIAGNOSTICS"
  SnoreAlarmTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SnoreAlarmTests
    dependencies:
      - target: SnoreAlarm
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SnoreAlarm:
    build:
      targets:
        SnoreAlarm: all
    test:
      targets:
        - SnoreAlarmTests
